name: release

# Tag-driven release (GitHub Release only).
#
# - push of a `v*` tag: test, build once, verify on each OS, then publish the GitHub Release.
# - push to `release/**`: the same test, build, and verify without publishing (dry run).
#
# Artifacts are built exactly once in the `build` job; every later job uses those bytes.
# The version comes only from the tag (`-X main.version=<tag>`). Branch dry runs embed
# `dev-<short sha>` so a dry-run binary can never be mistaken for a release.
#
# All builds use CGO_ENABLED=0. On macOS this means the Keychain unlock adapter
# (`darwin && cgo`) is not included and the release binary uses the master password only.

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test before build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.2'

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...

  build:
    name: build once
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.2'

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
            case "$version" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "tag is not a semantic version: $version" >&2; exit 1 ;;
            esac
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require a CHANGELOG section for tag releases
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! grep -q "^## \[${VERSION#v}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for ${VERSION#v}" >&2
            exit 1
          fi

      - name: Build all targets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CGO_ENABLED: '0'
        run: |
          set -eu
          mkdir -p dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="kinko_${VERSION}_${os}_${arch}"
            work="build/${name}"
            mkdir -p "$work"
            exe="kinko"
            if [ "$os" = "windows" ]; then exe="kinko.exe"; fi
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "${work}/${exe}" .
            cp LICENSE README.md "$work/"
            if [ "$os" = "windows" ]; then
              (cd build && zip -qr "../dist/${name}.zip" "$name")
            else
              tar -C build -czf "dist/${name}.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  verify:
    name: verify (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux_amd64
          - os: windows-latest
            target: windows_amd64
          - os: macos-latest
            target: darwin_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Check checksums and embedded version
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c SHA256SUMS
          else
            shasum -a 256 -c SHA256SUMS
          fi
          name="kinko_${VERSION}_${TARGET}"
          mkdir -p ../check
          if [ -f "${name}.zip" ]; then
            unzip -q "${name}.zip" -d ../check
            bin="../check/${name}/kinko.exe"
          else
            tar -C ../check -xzf "${name}.tar.gz"
            bin="../check/${name}/kinko"
          fi
          got="$("$bin" --version)"
          if [ "$got" != "$VERSION" ]; then
            echo "embedded version mismatch: got '$got', want '$VERSION'" >&2
            exit 1
          fi
          echo "kinko --version: $got"

  publish:
    name: publish GitHub Release
    needs: [build, verify]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Create the release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          awk -v v="${VERSION#v}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "empty release notes for $VERSION" >&2
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            # Already published: succeed only if it holds exactly these bytes.
            mkdir -p published
            gh release download "$VERSION" --pattern SHA256SUMS --dir published
            if cmp -s published/SHA256SUMS dist/SHA256SUMS; then
              echo "release $VERSION already published with identical artifacts"
              exit 0
            fi
            echo "release $VERSION exists with different artifacts; not overwriting" >&2
            exit 1
          fi
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$VERSION" dist/* \
            --title "kinko $VERSION" \
            --notes-file notes.md \
            --verify-tag $prerelease
